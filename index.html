<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>在庫管理</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <header class="app-header">
      <div>
        <p class="eyebrow">Local Inventory</p>
        <h1>在庫管理</h1>
      </div>
      <div class="header-actions">
        <button id="exportButton" class="secondary-button" type="button">JSON出力</button>
        <label class="secondary-button file-button" for="importFile">JSON読込</label>
        <input id="importFile" class="visually-hidden" type="file" accept="application/json,.json">
        <button id="clearDataButton" class="danger-button" type="button">全データ削除</button>
      </div>
    </header>

    <main class="app-shell">
      <section class="toolbar" aria-label="概要">
        <div>
          <span class="metric-label">商品数</span>
          <strong id="productCount">0</strong>
        </div>
        <div>
          <span class="metric-label">総在庫数</span>
          <strong id="totalQuantity">0</strong>
        </div>
        <div>
          <span class="metric-label">履歴件数</span>
          <strong id="movementCount">0</strong>
        </div>
      </section>

      <section class="workspace">
        <div class="panel product-panel">
          <div class="panel-heading">
            <h2 id="productFormTitle">商品登録</h2>
            <button id="cancelEditButton" class="text-button hidden" type="button">編集を中止</button>
          </div>
          <form id="productForm" class="form-grid">
            <input id="editingProductId" type="hidden">
            <label>
              <span>品番</span>
              <input id="productCode" name="productCode" type="text" required autocomplete="off">
            </label>
            <label>
              <span>品名</span>
              <input id="productName" name="productName" type="text" required autocomplete="off">
            </label>
            <label>
              <span>サイズ</span>
              <input id="productSize" name="productSize" type="text" autocomplete="off">
            </label>
            <label>
              <span>色</span>
              <input id="productColor" name="productColor" type="text" autocomplete="off">
            </label>
            <label>
              <span>数量</span>
              <input id="productQuantity" name="productQuantity" type="number" min="0" step="1" value="0" required>
            </label>
            <label>
              <span>カートン入数</span>
              <input id="cartonSize" name="cartonSize" type="number" min="1" step="1" value="1" required>
            </label>
            <button id="saveProductButton" class="primary-button wide" type="submit">商品を登録</button>
          </form>
        </div>

        <div class="panel movement-panel">
          <div class="panel-heading">
            <h2>入出庫</h2>
          </div>
          <form id="movementForm" class="form-grid">
            <label class="wide">
              <span>商品</span>
              <select id="movementProduct" required></select>
            </label>
            <div class="segmented wide" role="radiogroup" aria-label="入出庫種別">
              <label>
                <input type="radio" name="movementType" value="in" checked>
                <span>入庫</span>
              </label>
              <label>
                <input type="radio" name="movementType" value="out">
                <span>出庫</span>
              </label>
            </div>
            <label>
              <span>数量</span>
              <input id="movementQuantity" type="number" min="0" step="1" value="0">
            </label>
            <label>
              <span>カートン数</span>
              <input id="movementCartons" type="number" min="0" step="1" value="0">
            </label>
            <label class="wide">
              <span>メモ</span>
              <input id="movementMemo" type="text" autocomplete="off">
            </label>
            <p id="movementPreview" class="preview wide">換算数量: 0</p>
            <button class="primary-button wide" type="submit">在庫へ反映</button>
          </form>
        </div>
      </section>

      <section class="list-section">
        <div class="section-heading">
          <h2>在庫一覧</h2>
          <label class="search-box">
            <span>検索</span>
            <input id="searchInput" type="search" placeholder="品番・品名・サイズ・色">
          </label>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th><button class="sort-button" data-sort-key="productCode" type="button">品番</button></th>
                <th><button class="sort-button" data-sort-key="size" type="button">サイズ</button></th>
                <th><button class="sort-button" data-sort-key="name" type="button">品名</button></th>
                <th><button class="sort-button" data-sort-key="color" type="button">色</button></th>
                <th class="number-cell"><button class="sort-button" data-sort-key="cartonSize" type="button">入数</button></th>
                <th class="number-cell"><button class="sort-button" data-sort-key="quantity" type="button">数量</button></th>
                <th class="number-cell">カートン数/端数</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="inventoryBody"></tbody>
          </table>
        </div>
      </section>

      <section class="list-section">
        <div class="section-heading">
          <h2>入出庫履歴</h2>
          <button id="clearHistoryButton" class="secondary-button" type="button">履歴を削除</button>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>日時</th>
                <th>区分</th>
                <th>品番</th>
                <th>品名</th>
                <th class="number-cell">数量</th>
                <th class="number-cell">カートン数</th>
                <th>メモ</th>
              </tr>
            </thead>
            <tbody id="historyBody"></tbody>
          </table>
        </div>
      </section>
    </main>

    <template id="emptyRowTemplate">
      <tr>
        <td class="empty-state">登録データがありません。</td>
      </tr>
    </template>

    <script src="app.js"></script>
  </body>
</html>
